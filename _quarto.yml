project:
  type: website
  output-dir: docs
  pre-render:
    - Rscript protocols_src/_R/build_registry.R
    - Rscript protocols_src/_validate_dependencies.R --quiet
    - Rscript protocols_src/_lint_symbols.R
  resources:
    - protocols_src/templates/*
    - protocols_src/resources/*.html
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!protocols_src/templates/blocks/"

website:
  title: "Protocol Library"
  site-url: "https://dilloncorvino.com/lab-protocols"
  bread-crumbs: true
  favicon: favicon.svg
  page-footer:
    left: "Protocol Library - CC BY 4.0 - Dillon Corvino"
    right:
      - text: "GitHub"
        href: https://github.com/Eomesodermin/lab-protocols
      - text: "Cite"
        href: https://doi.org/10.5281/zenodo.23950821

  search:
    location: navbar
    type: overlay
    limit: 20
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Protocols"
        menu:
          - text: "Mouse"
            href: protocols_src/mouse/index.qmd
          - text: "Human"
            href: protocols_src/human/index.qmd
          - text: "General"
            href: protocols_src/general/index.qmd
      - text: "Buffers"
        href: protocols_src/buffers/index.qmd
      - text: "Buffer / protocol links"
        href: protocols_src/cross_reference.qmd
      - text: "Templates"
        href: protocols_src/templates/index.qmd
      - text: "Resources"
        href: protocols_src/resources/index.qmd

filters:
  - protocols_src/_filters/doc_header.lua
  - protocols_src/_filters/autolink.lua
  - protocols_src/_filters/pdf_symbols.lua

format:
  html:
    title-block-banner: true
    grid:
      sidebar-width: 260px
      body-width: 940px
      margin-width: 280px
      gutter-width: 2rem
    theme:
      light: [cosmo, theme/light.scss, theme/rules.scss, theme/listing.scss, theme/matrix.scss, theme/resources.scss, theme/templates.scss, theme/layout.scss, theme/banner.scss, theme/sections.scss, theme/badges.scss]
      dark: [darkly, theme/dark.scss, theme/rules.scss, theme/listing.scss, theme/matrix.scss, theme/resources.scss, theme/templates.scss, theme/layout.scss, theme/banner.scss, theme/sections.scss, theme/badges.scss]
    css: styles.css
    respect-user-color-scheme: true
    anchor-sections: true
    smooth-scroll: true
    math: mathjax
    toc: true
    back-to-top: true
    format-links: [pdf]
    number-sections: false
    geometry: "margin=2cm"
    fontsize: 11pt
    colorlinks: false
  pdf:
    toc: false
    pdf-engine: xelatex
    number-sections: false
    geometry: "margin=2cm"
    fontsize: 11pt
    colorlinks: true
    linkcolor: black
    urlcolor: linkblue
    citecolor: linkblue
    include-in-header:
      text: |
        \usepackage{xcolor}
        \definecolor{linkblue}{HTML}{0F5C8C}
